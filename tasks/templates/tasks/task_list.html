<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">My To-Do List</h1>

        <!-- Add Task Form -->
        <form method="POST" action="{% url 'task_add' %}" class="mb-4">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="title" class="form-control" placeholder="New Task" required>
                <button class="btn btn-primary" type="submit">Add Task</button>
            </div>
        </form>

        <!-- Active Tasks Section -->
        <h2>Active Tasks</h2>
        <ul class="list-group">
            {% for task in active_tasks %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <form method="POST" action="{% url 'toggle_task_complete' task.id %}" style="margin: 0;">
                    {% csrf_token %}
                    <input type="checkbox" class="form-check-input me-2" onchange="this.form.submit()">
                    {% if task.completed %}checked{% endif %}
                    {{ task.title }}
                </form>
            </li>
            {% empty %}
            <p>No active tasks available.</p>
            {% endfor %}
        </ul>
    </div>
</body>

</html>
